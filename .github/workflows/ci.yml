name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download champion model
        run: |
          curl -L \
            -o champion-model.zip \
            https://github.com/Avishitayal/mlops-churn-project/releases/download/model-v1/champion-model.zip

          mkdir -p models/champion
          unzip -q champion-model.zip -d models/champion

          ls -lh models/champion

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/avishitayal/mlops-churn-project:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/avishitayal/mlops-churn-project:${{ github.sha }}